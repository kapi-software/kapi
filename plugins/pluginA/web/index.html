<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>示例插件 A</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        color: #fff;
      }
      .card {
        padding: 32px 40px;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(8px);
        text-align: center;
      }
      h1 { margin: 0 0 4px; font-size: 22px; }
      p { margin: 0 0 20px; font-size: 13px; opacity: 0.85; }
      button {
        font-size: 15px;
        padding: 10px 24px;
        border: none;
        border-radius: 999px;
        background: #fff;
        color: #6366f1;
        font-weight: 600;
        cursor: pointer;
      }
      .count { margin-top: 16px; font-size: 28px; font-weight: 700; }
      .event {
        margin-top: 14px;
        font-size: 11px;
        opacity: 0.75;
        min-height: 1.2em;
        word-break: break-all;
      }
      #note { margin-top: 6px; font-size: 11px; opacity: 0.75; min-height: 1em; }
    </style>
    <!-- @kapi/plugin-sdk：宿主保留路径分发（kapi-plugin:///__kapi__/sdk.js） -->
    <!-- @kapi/plugin-sdk: served from the host's reserved path -->
    <script src="/__kapi__/sdk.js"></script>
  </head>
  <body>
    <div class="card">
      <h1>示例插件 A</h1>
      <p>Sample Plugin A · @kapi/plugin-sdk 桥接 / bridged via @kapi/plugin-sdk</p>
      <button id="inc">点我 +1 / Click me</button>
      <div class="count" id="count">0</div>
      <div class="event" id="event"></div>
      <p id="note"></p>
    </div>
    <script>
      // SDK 用法示范：storage 持久化 + 事件回环（emit → 宿主扇出 → SDK 分发）
      // SDK usage demo: storage persistence + an event round-trip
      let n = 0;
      const countEl = document.getElementById("count");
      const eventEl = document.getElementById("event");
      const noteEl = document.getElementById("note");

      // 启动恢复持久化计数（manifest 已声明 storage:read/write）
      // Restore the persisted counter on load (manifest declares storage:read/write)
      kapi.storage
        .get("counter")
        .then((res) => {
          if (res && typeof res.value === "number") {
            n = Math.floor(res.value);
            countEl.textContent = String(n);
            noteEl.textContent = "计数已从插件存储恢复 / counter restored from plugin storage";
          }
        })
        .catch(() => {
          // 浏览器预览 / 未授权 / 库未就绪：降级为纯内存计数
          // Browser preview / denied / DB not ready: fall back to in-memory counting
          noteEl.textContent = "存储不可用，仅内存计数 / storage unavailable, in-memory only";
        });

      // 订阅自身事件：验证 emit → Rust 扇出 → PluginHost 转发 → SDK 分发的完整链路
      // Subscribe to our own event: verifies emit -> Rust fan-out -> PluginHost relay
      // -> SDK dispatch end to end
      kapi.events
        .on("counter.changed", (ev) => {
          eventEl.textContent =
            "on(counter.changed) · data=" + JSON.stringify(ev.data) + " · source=" + ev.source;
        })
        .catch((err) => {
          eventEl.textContent = "事件订阅失败 / subscribe failed: " + err.message;
        });

      document.getElementById("inc").addEventListener("click", () => {
        n += 1;
        countEl.textContent = String(n);
        // 持久化 + 广播（manifest 已声明 storage:write / events:emit）
        // Persist and broadcast (manifest declares storage:write / events:emit)
        kapi.storage.set("counter", n).catch(() => {});
        kapi.events.emit("counter.changed", { count: n }).catch(() => {});
      });
    </script>
  </body>
</html>
