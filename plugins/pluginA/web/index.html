<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>示例插件 A</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        color: #fff;
      }
      .card {
        padding: 32px 40px;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(8px);
        text-align: center;
      }
      h1 { margin: 0 0 4px; font-size: 22px; }
      p { margin: 0 0 20px; font-size: 13px; opacity: 0.85; }
      button {
        font-size: 15px;
        padding: 10px 24px;
        border: none;
        border-radius: 999px;
        background: #fff;
        color: #6366f1;
        font-weight: 600;
        cursor: pointer;
      }
      .count { margin-top: 16px; font-size: 28px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>示例插件 A</h1>
      <p>Sample Plugin A · 经 kapi-plugin:// 协议加载 / served via kapi-plugin://</p>
      <button id="inc">点我 +1 / Click me</button>
      <div class="count" id="count">0</div>
      <p id="note" style="min-height: 1em; font-size: 11px; opacity: 0.75"></p>
    </div>
    <script>
      // 裸桥接 RPC：@kapi/plugin-sdk 接入后由 SDK 替换（当前刻意内联，双样例共用同款写法）
      // Raw bridge RPC: replaced by @kapi/plugin-sdk later (deliberately inline for now)
      // 协议见 docs/PANEL.md §3：请求 {id, channel, payload}；响应 {id, ok, data} | {id, ok, error}
      // Protocol per docs/PANEL.md §3: request {id, channel, payload}; response {id, ok, data|error}
      let seq = 0;
      const pending = new Map();
      function call(channel, payload) {
        return new Promise((resolve, reject) => {
          const id = ++seq;
          pending.set(id, { resolve, reject });
          parent.postMessage({ id, channel, payload }, "*");
        });
      }
      window.addEventListener("message", (e) => {
        const msg = e.data;
        if (!msg || typeof msg !== "object" || !pending.has(msg.id)) return;
        const { resolve, reject } = pending.get(msg.id);
        pending.delete(msg.id);
        msg.ok ? resolve(msg.data) : reject(new Error(msg.error || "bridge error"));
      });

      let n = 0;
      const countEl = document.getElementById("count");
      const noteEl = document.getElementById("note");

      // 启动恢复持久化计数（manifest 已声明 storage:read/write）
      // Restore the persisted counter on load (manifest declares storage:read/write)
      call("kapi:storage.get", { key: "counter" })
        .then((res) => {
          if (res && typeof res.value === "number") {
            n = Math.floor(res.value);
            countEl.textContent = String(n);
            noteEl.textContent = "计数已从插件存储恢复 / counter restored from plugin storage";
          }
        })
        .catch(() => {
          // 浏览器预览 / 未授权 / 库未就绪：降级为纯内存计数
          // Browser preview / denied / DB not ready: fall back to in-memory counting
          noteEl.textContent = "存储不可用，仅内存计数 / storage unavailable, in-memory only";
        });

      document.getElementById("inc").addEventListener("click", () => {
        n += 1;
        countEl.textContent = String(n);
        // 持久化失败不阻断交互（降级为内存计数）
        // A failed persist never blocks the interaction (in-memory fallback)
        call("kapi:storage.set", { key: "counter", value: n }).catch(() => {});
      });
    </script>
  </body>
</html>
