<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>示例插件 D · WASM</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
        color: #fff;
      }
      .card {
        padding: 28px 36px;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(8px);
        text-align: center;
        min-width: 320px;
      }
      h1 { margin: 0 0 4px; font-size: 20px; }
      p.desc { margin: 0 0 18px; font-size: 12px; opacity: 0.85; }
      .row { display: flex; gap: 8px; justify-content: center; }
      input {
        flex: 1;
        font-size: 14px;
        padding: 8px 12px;
        border: none;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        color: #1e293b;
      }
      button {
        font-size: 13px;
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        background: #fff;
        color: #4f46e5;
        font-weight: 600;
        cursor: pointer;
      }
      #result {
        margin-top: 14px;
        font-size: 15px;
        min-height: 1.4em;
        word-break: break-all;
      }
      #result.err { color: #fecaca; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>示例插件 D · WASM</h1>
      <p class="desc">kapi:plugin.invoke → wasmtime 沙箱（reverse / log 动作）</p>
      <div class="row">
        <input id="text" placeholder="输入文字 / type something" value="Hello Kapi" />
        <button id="reverse">反转 / Reverse</button>
        <button id="log">写日志 / Log</button>
      </div>
      <div id="result"></div>
    </div>
    <script>
      // 裸桥接 RPC：与 pluginA 同款（@kapi/plugin-sdk 接入后由 SDK 替换）
      // Raw bridge RPC: same as pluginA (replaced by @kapi/plugin-sdk later)
      let seq = 0;
      const pending = new Map();
      function call(channel, payload) {
        return new Promise((resolve, reject) => {
          const id = ++seq;
          pending.set(id, { resolve, reject });
          parent.postMessage({ id, channel, payload }, "*");
        });
      }
      window.addEventListener("message", (e) => {
        const msg = e.data;
        if (!msg || typeof msg !== "object" || !pending.has(msg.id)) return;
        const { resolve, reject } = pending.get(msg.id);
        pending.delete(msg.id);
        msg.ok ? resolve(msg.data) : reject(new Error(msg.error || "bridge error"));
      });

      const result = document.getElementById("result");
      // 调自身 WASM：kapi:plugin.invoke {action, payload}
      // Invoke the plugin's own WASM: kapi:plugin.invoke {action, payload}
      function invoke(action) {
        const text = document.getElementById("text").value;
        result.className = "";
        result.textContent = "…";
        call("kapi:plugin.invoke", { action, payload: { text } })
          .then((data) => {
            result.textContent = action === "reverse" ? data.text : "已写入系统日志 / logged";
          })
          .catch((err) => {
            result.className = "err";
            result.textContent = String(err.message || err);
          });
      }
      document.getElementById("reverse").addEventListener("click", () => invoke("reverse"));
      document.getElementById("log").addEventListener("click", () => invoke("log"));
    </script>
  </body>
</html>
