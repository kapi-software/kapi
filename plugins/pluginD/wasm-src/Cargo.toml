# pluginD WASM 入口 crate：构建为 wasm32-wasip1 cdylib（Kapi ABI v1）
# pluginD WASM entry crate: built as a wasm32-wasip1 cdylib (Kapi ABI v1)
# 构建见 README.md；产物拷贝为 ../main.wasm 提交
# Build steps in README.md; the artifact is copied to ../main.wasm and committed
[package]
name = "plugin-d-wasm"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

# 控制产物体积（fixture 提交进仓库）/ keep the committed fixture small
[profile.release]
opt-level = "s"
lto = true
strip = true
