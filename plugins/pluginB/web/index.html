<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>示例插件 B</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(135deg, #10b981 0%, #0d9488 100%);
        color: #fff;
      }
      .card {
        padding: 32px 40px;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(8px);
        text-align: center;
      }
      h1 { margin: 0 0 4px; font-size: 22px; }
      p { margin: 0; font-size: 13px; opacity: 0.85; line-height: 1.7; }
      code {
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.3);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>示例插件 B</h1>
      <p>
        Sample Plugin B · 独立窗口模式<br />
        本窗口由 manifest.window 定义：<code>480×360</code>、最小 <code>360×280</code><br />
        This window comes from manifest.window: <code>480x360</code>, min <code>360x280</code>
      </p>
    </div>
  </body>
</html>
