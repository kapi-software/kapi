[package]
name = "tauri-app"
version = "0.1.0"
description = "Kapi - Tauri-based plugin-oriented desktop application"
authors = ["Kapi Development Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
# macos-private-api：Dock 透明窗口在 macOS 上的必要特性（Windows 无副作用）
# tray-icon：系统托盘（docs/PANEL.md 驻留运行）
# macos-private-api: required for the transparent dock window on macOS (no-op on Windows)
# tray-icon: system tray (resident app per docs/PANEL.md)
tauri = { version = "2", features = ["config-json5", "macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# 剪贴板触发器：Tauri 官方插件（取代手动 arboard 轮询）
# Clipboard trigger: official Tauri plugin (replaces manual arboard polling)
tauri-plugin-clipboard-manager = "2"
# 全局快捷键触发器：Tauri 官方插件
# Global hotkey trigger: official Tauri plugin
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 与 tauri-plugin-sql 共用同一连接池（DbInstances），版本需与其 0.8 对齐
# Shares the pool with tauri-plugin-sql (DbInstances); must stay on its 0.8 line
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
# 插件桥接：剪贴板（Rust 侧专用，官方剪贴板插件内部同为 arboard，且不暴露 JS 面）
# Plugin bridge: clipboard (Rust-side only; the official clipboard plugin wraps arboard too)
arboard = "3"
# 插件桥接：kapi:http.fetch 宿主代理（域名白名单预检；rustls 免 Linux openssl 依赖）
# Plugin bridge: the kapi:http.fetch host proxy (behind the host whitelist; rustls avoids openssl)
# 版本对齐锁内 tauri 传递依赖 0.13，避免双版本编译；webpki-roots 内置根证书免系统依赖
# Aligned with the transitive 0.13 already in the lockfile; webpki-roots bundles the CA store
# 注：0.13 起 feature 更名（rustls-tls → rustls + webpki-roots）
# Note: features were renamed in 0.13 (rustls-tls -> rustls + webpki-roots)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
url = "2"
# WASM 运行时（docs/PLUGINS.md §5）：cranelift + wat（单测用 WAT）；与 wasmtime-wasi 严格同版本
# WASM runtime (docs/PLUGINS.md §5): cranelift + wat (for WAT unit tests); must match wasmtime-wasi
# feature 裁剪去掉 cache/profiling/coredump/winch/gc 等，缩短 Windows 首编（core wasm 无需 GC）
# Trimmed features (no cache/profiling/coredump/winch/gc) shorten the first Windows build
wasmtime = { version = "48.0.1", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
    "wat",
    "anyhow",
    "parallel-compilation",
] }
# WASI preview1：wasm32-wasip1 产物的 std 依赖（无 preopen / 无网络 / 空环境）
# WASI preview1: required by wasm32-wasip1 std (no preopens / no network / empty env)
wasmtime-wasi = { version = "48.0.1", default-features = false, features = ["p1"] }
# WASM 执行放 spawn_blocking，宿主函数内经 Handle::block_on 桥接异步 DB/HTTP；macros 供 #[tokio::test]
# WASM runs in spawn_blocking; host functions bridge async DB/HTTP via Handle::block_on; macros for tests
# time 特性：定时器（schedule 触发器）；sync：触发器注册表/取消令牌
# time feature: timers (schedule trigger); sync: trigger registry / cancellation tokens
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
# CancellationToken：触发器后台任务退出信号（schedule / plugin_event 轮询）
# CancellationToken: shutdown signal for trigger background tasks (schedule / plugin_event polling)
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
# Transform 节点：handlebars 模板（替换上游输出为下游期望的 JSON）
# Transform node: handlebars templates (reshape upstream output to downstream input)
handlebars = "5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Dock 光标轮询（docs/DOCK.md §4）：仅 Windows 需要 Win32 API
# Dock cursor polling (docs/DOCK.md §4): Win32 API needed on Windows only
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

