[package]
name = "tauri-app"
version = "0.1.0"
description = "Kapi - Tauri-based plugin-oriented desktop application"
authors = ["Kapi Development Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
# macos-private-api：Dock 透明窗口在 macOS 上的必要特性（Windows 无副作用）
# macos-private-api: required for the transparent dock window on macOS (no-op on Windows)
tauri = { version = "2", features = ["config-json5", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dock 光标轮询（docs/DOCK.md §4）：仅 Windows 需要 Win32 API
# Dock cursor polling (docs/DOCK.md §4): Win32 API needed on Windows only
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

